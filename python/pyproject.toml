[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "serpscraper"
version = "1.1.0"
description = "Official Python client for SerpScraper.Dev API."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "SerpScraper.Dev", email = "domaininfo2110@gmail.com" }
]
keywords = ["serp", "serpscraper", "google", "bing", "search-api", "ai-overview", "google-trends"]
